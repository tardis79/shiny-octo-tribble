<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vercel Connection Test</title>
    <meta
      name="description"
      content="A lightweight static page for confirming that a Vercel deployment and domain connection are working."
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7fb;
        --panel: #ffffff;
        --text: #17202a;
        --muted: #5d6b7a;
        --line: #dbe1e8;
        --ok: #11885d;
        --ok-soft: #dff6ec;
        --accent: #275efe;
        --shadow: 0 18px 60px rgba(23, 32, 42, 0.12);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #11151c;
          --panel: #191f29;
          --text: #f4f7fb;
          --muted: #a8b3c2;
          --line: #2f3948;
          --ok: #3ddc97;
          --ok-soft: rgba(61, 220, 151, 0.12);
          --accent: #8fb1ff;
          --shadow: 0 18px 60px rgba(0, 0, 0, 0.24);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 18px;
        background:
          radial-gradient(circle at top left, rgba(39, 94, 254, 0.14), transparent 34%),
          linear-gradient(145deg, var(--bg), color-mix(in srgb, var(--bg) 88%, var(--accent)));
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        letter-spacing: 0;
      }

      main {
        width: min(760px, 100%);
        padding: clamp(24px, 5vw, 46px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: color-mix(in srgb, var(--panel) 96%, transparent);
        box-shadow: var(--shadow);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border: 1px solid color-mix(in srgb, var(--ok) 34%, var(--line));
        border-radius: 999px;
        background: var(--ok-soft);
        color: var(--ok);
        font-size: 0.94rem;
        font-weight: 700;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 0 7px color-mix(in srgb, var(--ok) 16%, transparent);
      }

      h1 {
        margin: 24px 0 10px;
        font-size: clamp(2.1rem, 7vw, 4.2rem);
        line-height: 0.96;
        letter-spacing: 0;
      }

      p {
        max-width: 62ch;
        margin: 0;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.65;
      }

      dl {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
        margin: 30px 0 0;
      }

      .row {
        display: grid;
        grid-template-columns: minmax(120px, 0.34fr) minmax(0, 1fr);
        gap: 14px;
        align-items: center;
        min-height: 48px;
        padding: 12px 0;
        border-top: 1px solid var(--line);
      }

      dt {
        color: var(--muted);
        font-size: 0.88rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      dd {
        margin: 0;
        overflow-wrap: anywhere;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.98rem;
      }

      a {
        color: var(--accent);
        text-decoration-thickness: 2px;
        text-underline-offset: 3px;
      }

      @media (max-width: 540px) {
        main {
          padding: 24px;
        }

        .row {
          grid-template-columns: 1fr;
          gap: 6px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status" aria-label="Connection status">
        <span class="dot" aria-hidden="true"></span>
        Connection OK
      </div>

      <h1>Vercel is serving this page.</h1>
      <p>
        If you can see this page on your Vercel domain, the deployment is live and the
        domain route is reaching the project successfully.
      </p>

      <dl>
        <div class="row">
          <dt>Host</dt>
          <dd id="host">Loading...</dd>
        </div>
        <div class="row">
          <dt>Protocol</dt>
          <dd id="protocol">Loading...</dd>
        </div>
        <div class="row">
          <dt>Checked At</dt>
          <dd id="checked-at">Loading...</dd>
        </div>
        <div class="row">
          <dt>Project</dt>
          <dd>Static HTML test for Vercel import</dd>
        </div>
      </dl>
    </main>

    <script>
      const now = new Date();

      document.getElementById("host").textContent = window.location.host || "local file";
      document.getElementById("protocol").textContent =
        window.location.protocol === "file:" ? "file:// local preview" : window.location.protocol;
      document.getElementById("checked-at").textContent = now.toLocaleString(undefined, {
        dateStyle: "medium",
        timeStyle: "medium",
      });
    </script>
  </body>
</html>
